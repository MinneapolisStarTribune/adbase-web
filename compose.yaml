services:
  adbase-web:
    build: .
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      APP_ENV: test
      DATA_SOURCE: mock
      AUTH_MODE: mock
      APP_ORIGIN: http://localhost:3000
    init: true
    restart: unless-stopped
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 512M
